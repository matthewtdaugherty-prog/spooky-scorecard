<script>
        // Exactly 7 puzzles[cite: 1]
        const PUZZLES = [
            { label: "Puzzle #1", key: "puzzle-1" },
            { label: "Puzzle #2", key: "puzzle-2" },
            { label: "Puzzle #3", key: "puzzle-3" },
            { label: "Puzzle #4", key: "puzzle-4" },
            { label: "Puzzle #5", key: "puzzle-5" },
            { label: "Puzzle #6", key: "puzzle-6" },
            { label: "Puzzle #7", key: "puzzle-7", isHalloween: true }
        ];

        const TOTAL_PUZZLES = PUZZLES.length;
        const STORAGE_KEY = 'spooky_puzzle_1v1_oct_2026_v2';
        const SETTINGS_KEY = 'spooky_puzzle_settings_v2';

        // App State[cite: 1]
        let settings = {
            p1Name: "Player 1",
            p2Name: "Player 2"
        };

        let puzzleData = {};
        let currentFilter = 'all';

        function getPuzzleLabel(key) {
            const puzzle = PUZZLES.find(p => p.key === key);
            return puzzle ? puzzle.label : key;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Immediately load local storage so the UI renders without waiting on the network[cite: 1]
            loadFromLocalStorage();
            updatePlayerNamesUI();
            renderScorecardGrid();
            updateStatsAndBanner();

            // 2. Fetch remote data asynchronously in the background[cite: 1]
            await fetchRemoteData();
        });

        // --- Server / File API Persistence ---[cite: 1]

        async function fetchRemoteData() {
            try {
                const res = await fetch('api.php');
                if (!res.ok) {
                    throw new Error(`Server returned status ${res.status}`);
                }
                
                const text = await res.text();
                // Ensure the response is actual JSON before attempting parse
                if (text && text.trim().startsWith('{')) {
                    const data = JSON.parse(text);
                    if (data.settings) settings = data.settings;
                    if (data.puzzleData) puzzleData = data.puzzleData;
                    
                    saveToLocalStorage();
                    updatePlayerNamesUI();
                    renderScorecardGrid();
                    updateStatsAndBanner();
                } else {
                    console.warn("api.php returned non-JSON data (possibly a PHP error or firewall challenge):", text);
                }
            } catch (err) {
                console.warn("Backend unavailable or returned error, relying on local storage cache:", err);
            }
        }

        async function persistAllData() {
            // Instant local cache[cite: 1]
            saveToLocalStorage();

            // Save to backend via PHP script
            try {
                const res = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ settings, puzzleData })
                });
                if (!res.ok) {
                    console.error("Save failed with status:", res.status);
                }
            } catch (err) {
                console.error("Failed to write to server data file:", err);
            }
        }

        function loadFromLocalStorage() {
            try {
                const savedSettings = localStorage.getItem(SETTINGS_KEY);
                if (savedSettings) settings = JSON.parse(savedSettings);
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) puzzleData = JSON.parse(savedData);
            } catch (e) {
                console.error("Local storage load failed", e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(puzzleData));
            } catch (e) {
                console.error("Local storage write failed", e);
            }
        }

        function saveData() {
            persistAllData();
        }

        function saveSettingsToStorage() {
            persistAllData();
        }

        function updatePlayerNamesUI() {
            const p1 = settings.p1Name || "Player 1";
            const p2 = settings.p2Name || "Player 2";

            document.getElementById('banner-p1-name').innerText = p1;
            document.getElementById('banner-p2-name').innerText = p2;
            document.getElementById('lb-p1-title').innerHTML = `<span>🎃</span> ${p1} Solve Rankings`;
            document.getElementById('lb-p2-title').innerHTML = `<span>👻</span> ${p2} Solve Rankings`;

            document.getElementById('input-p1-name').value = p1;
            document.getElementById('input-p2-name').value = p2;
        }

        function switchTab(tabName) {
            const scorecardTab = document.getElementById('tab-scorecard');
            const leaderboardTab = document.getElementById('tab-leaderboard');
            const btnScorecard = document.getElementById('btn-scorecard');
            const btnLeaderboard = document.getElementById('btn-leaderboard');

            if (tabName === 'scorecard') {
                scorecardTab.classList.remove('hidden');
                leaderboardTab.classList.add('hidden');
                btnScorecard.className = "px-4 py-2 rounded-xl font-semibold text-sm transition-all duration-200 bg-orange-600 text-white shadow-lg shadow-orange-600/30 border border-orange-400/50 flex items-center gap-2";
                btnLeaderboard.className = "px-4 py-2 rounded-xl font-semibold text-sm transition-all duration-200 bg-purple-900/60 text-purple-200 hover:bg-purple-800 border border-purple-700/50 flex items-center gap-2";
                renderScorecardGrid();
            } else {
                scorecardTab.classList.add('hidden');
                leaderboardTab.classList.remove('hidden');
                btnLeaderboard.className = "px-4 py-2 rounded-xl font-semibold text-sm transition-all duration-200 bg-orange-600 text-white shadow-lg shadow-orange-600/30 border border-orange-400/50 flex items-center gap-2";
                btnScorecard.className = "px-4 py-2 rounded-xl font-semibold text-sm transition-all duration-200 bg-purple-900/60 text-purple-200 hover:bg-purple-800 border border-purple-700/50 flex items-center gap-2";
                renderLeaderboardAndAnalytics();
            }
            updateStatsAndBanner();
        }

        function filterDays(filter) {
            currentFilter = filter;
            ['all', 'completed', 'pending'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-purple-900 text-white transition";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-300 hover:bg-purple-950 transition";
                }
            });
            renderScorecardGrid();
        }

        function setDifficulty(player, dateKey, rating) {
            const currentRating = parseInt(document.getElementById(`${player}-diff-${dateKey}`).value) || 0;
            const newRating = (currentRating === rating) ? 0 : rating;
            document.getElementById(`${player}-diff-${dateKey}`).value = newRating;
            renderStarIcons(player, dateKey, newRating);
        }

        function renderStarIcons(player, dateKey, rating) {
            const container = document.getElementById(`${player}-stars-${dateKey}`);
            if (!container) return;
            const stars = container.querySelectorAll('.star-btn');
            const activeColor = player === 'p1' ? 'text-amber-400' : 'text-cyan-400';
            
            stars.forEach((star, index) => {
                const starVal = index + 1;
                if (starVal <= rating) {
                    star.className = `star-btn ${activeColor} drop-shadow-[0_0_6px_rgba(251,191,36,0.6)]`;
                    star.innerText = '★';
                } else {
                    star.className = 'star-btn text-gray-600 hover:text-gray-400';
                    star.innerText = '☆';
                }
            });
        }

        function renderScorecardGrid() {
            const grid = document.getElementById('days-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const p1Name = settings.p1Name || "Player 1";
            const p2Name = settings.p2Name || "Player 2";

            PUZZLES.forEach(puzzle => {
                const dateKey = puzzle.key;
                const isFinalDay = puzzle.isHalloween || false;
                const entry = puzzleData[dateKey] || { 
                    p1: { min: '', sec: '', totalSec: 0, notes: '', difficulty: 0 }, 
                    p2: { min: '', sec: '', totalSec: 0, notes: '', difficulty: 0 } 
                };

                const p1Notes = (entry.p1 && entry.p1.notes !== undefined) ? entry.p1.notes : (entry.notes || '');
                const p2Notes = (entry.p2 && entry.p2.notes !== undefined) ? entry.p2.notes : '';
                const p1Diff = (entry.p1 && entry.p1.difficulty) ? parseInt(entry.p1.difficulty) : 0;
                const p2Diff = (entry.p2 && entry.p2.difficulty) ? parseInt(entry.p2.difficulty) : 0;

                const p1Sec = entry.p1 && entry.p1.totalSec > 0 ? entry.p1.totalSec : 0;
                const p2Sec = entry.p2 && entry.p2.totalSec > 0 ? entry.p2.totalSec : 0;
                
                const p1Done = p1Sec > 0;
                const p2Done = p2Sec > 0;
                const bothDone = p1Done && p2Done;

                if (currentFilter === 'completed' && !bothDone) return;
                if (currentFilter === 'pending' && (p1Done || p2Done)) return;

                let winnerBadge = '<span class="text-xs text-gray-400 font-medium">⚔️️ Versus</span>';
                if (p1Done && p2Done) {
                    if (p1Sec < p2Sec) {
                        winnerBadge = `<span class="px-2.5 py-0.5 bg-orange-950 text-orange-400 font-bold rounded-lg border border-orange-700/50 text-xs">🎃 ${p1Name} Wins!</span>`;
                    } else if (p2Sec < p1Sec) {
                        winnerBadge = `<span class="px-2.5 py-0.5 bg-blue-950 text-blue-400 font-bold rounded-lg border border-blue-700/50 text-xs">👻 ${p2Name} Wins!</span>`;
                    } else {
                        winnerBadge = `<span class="px-2.5 py-0.5 bg-purple-950 text-purple-300 font-bold rounded-lg border border-purple-700/50 text-xs">🤝 Dead Heat!</span>`;
                    }
                } else if (p1Done) {
                    winnerBadge = `<span class="px-2 py-0.5 bg-orange-950/50 text-orange-300 rounded-lg text-xs">🎃 ${p1Name} Done</span>`;
                } else if (p2Done) {
                    winnerBadge = `<span class="px-2 py-0.5 bg-blue-950/50 text-blue-300 rounded-lg text-xs">👻 ${p2Name} Done</span>`;
                }

                const card = document.createElement('div');
                
                if (isFinalDay) {
                    card.className = `lg:col-span-3 md:col-span-2 bg-gradient-to-r from-orange-950/80 via-orange-900/60 to-orange-950/80 rounded-2xl p-6 border-2 border-orange-500/80 halloween-glow transition-all duration-200 flex flex-col justify-between shadow-2xl`;
                } else {
                    card.className = `bg-halloween-card rounded-2xl p-4 border transition-all duration-200 flex flex-col justify-between ${bothDone ? 'border-purple-600/60 shadow-lg shadow-purple-950/30' : 'border-purple-900/50'}`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3 pb-2 border-b ${isFinalDay ? 'border-orange-500/40' : 'border-purple-900/40'}">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${isFinalDay ? 'bg-orange-600 text-white font-bold tracking-wide shadow-md shadow-orange-600/40' : 'bg-purple-950 text-purple-300 border border-purple-900'}">
                                    🧩 ${puzzle.label}
                                </span>
                                ${isFinalDay ? '<span class="text-xs font-creepster text-orange-300 tracking-wider hidden sm:inline">🎃 THE GRAND FINALE 🎃</span>' : ''}
                            </div>
                            <div>${winnerBadge}</div>
                        </div>

                        <!-- Dual Player Inputs Side by Side -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
                            <!-- Player 1 Column -->
                            <div class="${isFinalDay ? 'bg-black/40 border-orange-500/40' : 'bg-orange-950/20 border-orange-900/50'} border p-3 rounded-xl space-y-2.5">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-orange-400 truncate max-w-[130px]" title="${p1Name}">${p1Name}</span>
                                    <span class="text-[10px] text-gray-400">🎃</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <div class="flex-1">
                                        <label class="block text-[9px] uppercase text-gray-400 mb-0.5">Min</label>
                                        <input type="number" id="p1-min-${dateKey}" value="${entry.p1 && entry.p1.min !== undefined ? entry.p1.min : ''}" placeholder="0" min="0" max="999" class="w-full bg-black/60 border ${isFinalDay ? 'border-orange-600/60' : 'border-orange-900/60'} rounded-lg px-2 py-1.5 text-xs text-center text-white focus:outline-none focus:border-orange-400 font-mono">
                                    </div>
                                    <span class="text-orange-400 font-bold pt-4">:</span>
                                    <div class="flex-1">
                                        <label class="block text-[9px] uppercase text-gray-400 mb-0.5">Sec</label>
                                        <input type="number" id="p1-sec-${dateKey}" value="${entry.p1 && entry.p1.sec !== undefined ? entry.p1.sec : ''}" placeholder="0" min="0" max="59" class="w-full bg-black/60 border ${isFinalDay ? 'border-orange-600/60' : 'border-orange-900/60'} rounded-lg px-2 py-1.5 text-xs text-center text-white focus:outline-none focus:border-orange-400 font-mono">
                                    </div>
                                </div>

                                <!-- P1 Difficulty Rating -->
                                <div class="bg-black/30 p-1.5 rounded-lg border border-orange-950/60 flex items-center justify-between">
                                    <span class="text-[10px] text-orange-300 font-medium">Difficulty:</span>
                                    <input type="hidden" id="p1-diff-${dateKey}" value="${p1Diff}">
                                    <div id="p1-stars-${dateKey}" class="flex gap-1 text-sm leading-none">
                                        ${[1, 2, 3, 4, 5].map(star => `
                                            <span onclick="setDifficulty('p1', '${dateKey}',${star})" class="star-btn ${star <= p1Diff ? 'text-amber-400 drop-shadow-[0_0_6px_rgba(251,191,36,0.6)]' : 'text-gray-600 hover:text-gray-400'}">${star <= p1Diff ? '★' : '☆'}</span>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- P1 Notes -->
                                <div>
                                    <input type="text" id="p1-notes-${dateKey}" value="${p1Notes}" placeholder="Notes..." class="w-full bg-black/50 border border-orange-900/50 focus:border-orange-400 rounded-lg px-2.5 py-1 text-xs text-white placeholder-gray-500 focus:outline-none">
                                </div>
                            </div>

                            <!-- Player 2 Column -->
                            <div class="${isFinalDay ? 'bg-black/40 border-blue-500/40' : 'bg-blue-950/20 border-blue-900/50'} border p-3 rounded-xl space-y-2.5">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-blue-400 truncate max-w-[130px]" title="${p2Name}">${p2Name}</span>
                                    <span class="text-[10px] text-gray-400">👻</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <div class="flex-1">
                                        <label class="block text-[9px] uppercase text-gray-400 mb-0.5">Min</label>
                                        <input type="number" id="p2-min-${dateKey}" value="${entry.p2 && entry.p2.min !== undefined ? entry.p2.min : ''}" placeholder="0" min="0" max="999" class="w-full bg-black/60 border ${isFinalDay ? 'border-blue-600/60' : 'border-blue-900/60'} rounded-lg px-2 py-1.5 text-xs text-center text-white focus:outline-none focus:border-blue-400 font-mono">
                                    </div>
                                    <span class="text-blue-400 font-bold pt-4">:</span>
                                    <div class="flex-1">
                                        <label class="block text-[9px] uppercase text-gray-400 mb-0.5">Sec</label>
                                        <input type="number" id="p2-sec-${dateKey}" value="${entry.p2 && entry.p2.sec !== undefined ? entry.p2.sec : ''}" placeholder="0" min="0" max="59" class="w-full bg-black/60 border ${isFinalDay ? 'border-blue-600/60' : 'border-blue-900/60'} rounded-lg px-2 py-1.5 text-xs text-center text-white focus:outline-none focus:border-blue-400 font-mono">
                                    </div>
                                </div>

                                <!-- P2 Difficulty Rating -->
                                <div class="bg-black/30 p-1.5 rounded-lg border border-blue-950/60 flex items-center justify-between">
                                    <span class="text-[10px] text-blue-300 font-medium">Difficulty:</span>
                                    <input type="hidden" id="p2-diff-${dateKey}" value="${p2Diff}">
                                    <div id="p2-stars-${dateKey}" class="flex gap-1 text-sm leading-none">
                                        ${[1, 2, 3, 4, 5].map(star => `
                                            <span onclick="setDifficulty('p2', '${dateKey}',${star})" class="star-btn ${star <= p2Diff ? 'text-cyan-400 drop-shadow-[0_0_6px_rgba(34,211,238,0.6)]' : 'text-gray-600 hover:text-gray-400'}">${star <= p2Diff ? '★' : '☆'}</span>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- P2 Notes -->
                                <div>
                                    <input type="text" id="p2-notes-${dateKey}" value="${p2Notes}" placeholder="Notes..." class="w-full bg-black/50 border border-blue-900/50 focus:border-blue-400 rounded-lg px-2.5 py-1 text-xs text-white placeholder-gray-500 focus:outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 pt-3 mt-2 border-t ${isFinalDay ? 'border-orange-500/30' : 'border-purple-900/30'}">
                        <button onclick="saveDayTimes('${dateKey}')" class="flex-1 py-2 ${isFinalDay ? 'bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 shadow-orange-950/60 font-bold text-white' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold shadow-purple-950/40'} rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1.5 truncate px-3">
                            <span>🎃</span> Save ${puzzle.label}
                        </button>
                        ${(p1Done || p2Done || p1Notes || p2Notes || p1Diff > 0 || p2Diff > 0) ? `
                            <button onclick="clearDayTimes('${dateKey}')" class="p-2 bg-red-950/60 hover:bg-red-900 text-red-300 rounded-xl text-xs transition border border-red-900/50" title="Clear Puzzle Data">
                                🗑️
                            </button>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function saveDayTimes(dateKey) {
            const p1Min = parseInt(document.getElementById(`p1-min-${dateKey}`).value) || 0;
            const p1Sec = parseInt(document.getElementById(`p1-sec-${dateKey}`).value) || 0;
            const p2Min = parseInt(document.getElementById(`p2-min-${dateKey}`).value) || 0;
            const p2Sec = parseInt(document.getElementById(`p2-sec-${dateKey}`).value) || 0;

            const p1Notes = document.getElementById(`p1-notes-${dateKey}`).value.trim();
            const p2Notes = document.getElementById(`p2-notes-${dateKey}`).value.trim();
            const p1Diff = parseInt(document.getElementById(`p1-diff-${dateKey}`).value) || 0;
            const p2Diff = parseInt(document.getElementById(`p2-diff-${dateKey}`).value) || 0;

            const p1Total = (p1Min * 60) + p1Sec;
            const p2Total = (p2Min * 60) + p2Sec;

            if (p1Total === 0 && p2Total === 0 && !p1Notes && !p2Notes && p1Diff === 0 && p2Diff === 0) {
                delete puzzleData[dateKey];
            } else {
                puzzleData[dateKey] = {
                    dateKey: dateKey,
                    p1: { min: p1Min, sec: p1Sec, totalSec: p1Total, notes: p1Notes, difficulty: p1Diff },
                    p2: { min: p2Min, sec: p2Sec, totalSec: p2Total, notes: p2Notes, difficulty: p2Diff },
                    updatedAt: Date.now()
                };
                triggerSpookyCelebration();
            }

            saveData();
            renderScorecardGrid();
            updateStatsAndBanner();
        }

        function clearDayTimes(dateKey) {
            if (puzzleData[dateKey]) {
                delete puzzleData[dateKey];
                saveData();
                renderScorecardGrid();
                updateStatsAndBanner();
            }
        }

        function updateStatsAndBanner() {
            let p1Completed = 0, p1TotalSec = 0;
            let p2Completed = 0, p2TotalSec = 0;
            let p1Wins = 0, p2Wins = 0;

            const keys = Object.keys(puzzleData);
            keys.forEach(k => {
                const entry = puzzleData[k];
                if (entry.p1 && entry.p1.totalSec > 0) {
                    p1Completed++;
                    p1TotalSec += entry.p1.totalSec;
                }
                if (entry.p2 && entry.p2.totalSec > 0) {
                    p2Completed++;
                    p2TotalSec += entry.p2.totalSec;
                }

                if (entry.p1 && entry.p2 && entry.p1.totalSec > 0 && entry.p2.totalSec > 0) {
                    if (entry.p1.totalSec < entry.p2.totalSec) p1Wins++;
                    else if (entry.p2.totalSec < entry.p1.totalSec) p2Wins++;
                }
            });

            // Player 1 stats banner[cite: 1]
            const p1CompEl = document.getElementById('stat-p1-completed');
            const p1TotEl = document.getElementById('stat-p1-total');
            const p1AvgEl = document.getElementById('stat-p1-avg');
            if (p1CompEl) p1CompEl.innerText = `${p1Completed} / ${TOTAL_PUZZLES}`;
            if (p1TotEl) p1TotEl.innerText = formatTimeHHMMSS(p1TotalSec);
            if (p1AvgEl) p1AvgEl.innerText = p1Completed > 0 ? formatTimeMMSS(Math.round(p1TotalSec / p1Completed)) : '--:--';

            // Player 2 stats banner[cite: 1]
            const p2CompEl = document.getElementById('stat-p2-completed');
            const p2TotEl = document.getElementById('stat-p2-total');
            const p2AvgEl = document.getElementById('stat-p2-avg');
            if (p2CompEl) p2CompEl.innerText = `${p2Completed} / ${TOTAL_PUZZLES}`;
            if (p2TotEl) p2TotEl.innerText = formatTimeHHMMSS(p2TotalSec);
            if (p2AvgEl) p2AvgEl.innerText = p2Completed > 0 ? formatTimeMMSS(Math.round(p2TotalSec / p2Completed)) : '--:--';

            // Head to head matchup score[cite: 1]
            const mP1 = document.getElementById('matchup-p1-score');
            const mP2 = document.getElementById('matchup-p2-score');
            if (mP1) mP1.innerText = p1Wins;
            if (mP2) mP2.innerText = p2Wins;

            const p1Name = settings.p1Name || "Player 1";
            const p2Name = settings.p2Name || "Player 2";
            let leaderText = "Level pegging in the spooky graveyard!";
            if (p1Wins > p2Wins) leaderText = `🎃 ${p1Name} is leading the series!`;
            else if (p2Wins > p1Wins) leaderText = `👻 ${p2Name} is haunting the leaderboard!`;
            
            const leaderEl = document.getElementById('matchup-leader-text');
            if (leaderEl) leaderEl.innerText = leaderText;
        }

        function formatStarsText(stars) {
            if (!stars || stars <= 0) return '<span class="text-gray-600">---</span>';
            const fullStars = '★'.repeat(stars);
            const emptyStars = '☆'.repeat(5 - stars);
            return `<span class="text-amber-400 font-mono tracking-tighter">${fullStars}</span><span class="text-gray-600 font-mono tracking-tighter">${emptyStars}</span>`;
        }

        function renderLeaderboardAndAnalytics() {
            const p1Tbody = document.getElementById('lb-p1-tbody');
            const p2Tbody = document.getElementById('lb-p2-tbody');
            if (!p1Tbody || !p2Tbody) return;
            p1Tbody.innerHTML = '';
            p2Tbody.innerHTML = '';

            const p1Name = settings.p1Name || "Player 1";
            const p2Name = settings.p2Name || "Player 2";

            const p1Entries = [];
            const p2Entries = [];
            let fastestOverall = { sec: 999999, label: '--' };
            let closestDiff = 999999;
            let closestLabel = '--';

            Object.entries(puzzleData).forEach(([dateKey, item]) => {
                const label = getPuzzleLabel(dateKey);

                if (item.p1 && item.p1.totalSec > 0) {
                    p1Entries.push({ 
                        label: label, 
                        totalSec: item.p1.totalSec, 
                        notes: item.p1.notes || item.notes || '', 
                        difficulty: item.p1.difficulty || 0 
                    });
                    if (item.p1.totalSec < fastestOverall.sec) {
                        fastestOverall = { sec: item.p1.totalSec, label: `${p1Name} (${label} - ${formatTimeMMSS(item.p1.totalSec)})` };
                    }
                }
                if (item.p2 && item.p2.totalSec > 0) {
                    p2Entries.push({ 
                        label: label, 
                        totalSec: item.p2.totalSec, 
                        notes: item.p2.notes || '', 
                        difficulty: item.p2.difficulty || 0 
                    });
                    if (item.p2.totalSec < fastestOverall.sec) {
                        fastestOverall = { sec: item.p2.totalSec, label: `${p2Name} (${label} - ${formatTimeMMSS(item.p2.totalSec)})` };
                    }
                }

                if (item.p1 && item.p2 && item.p1.totalSec > 0 && item.p2.totalSec > 0) {
                    const diff = Math.abs(item.p1.totalSec - item.p2.totalSec);
                    if (diff < closestDiff) {
                        closestDiff = diff;
                        closestLabel = `${label} (${diff}s gap)`;
                    }
                }
            });

            p1Entries.sort((a, b) => a.totalSec - b.totalSec);
            p2Entries.sort((a, b) => a.totalSec - b.totalSec);

            if (p1Entries.length === 0) {
                p1Tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500 italic">No solves recorded yet.</td></tr>`;
            } else {
                p1Entries.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-purple-950/30 transition";
                    tr.innerHTML = `
                        <td class="py-2.5 px-3 font-mono font-bold text-orange-400">#${index + 1}</td>
                        <td class="py-2.5 px-3 text-purple-200">${item.label}</td>
                        <td class="py-2.5 px-3 font-mono font-bold text-white">${formatTimeMMSS(item.totalSec)}</td>
                        <td class="py-2.5 px-3 text-center text-xs">${formatStarsText(item.difficulty)}</td>
                        <td class="py-2.5 px-3 text-right text-xs text-gray-400 max-w-[120px] truncate" title="${item.notes}">${item.notes || '---'}</td>
                    `;
                    p1Tbody.appendChild(tr);
                });
            }

            if (p2Entries.length === 0) {
                p2Tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500 italic">No solves recorded yet.</td></tr>`;
            } else {
                p2Entries.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-purple-950/30 transition";
                    tr.innerHTML = `
                        <td class="py-2.5 px-3 font-mono font-bold text-blue-400">#${index + 1}</td>
                        <td class="py-2.5 px-3 text-purple-200">${item.label}</td>
                        <td class="py-2.5 px-3 font-mono font-bold text-white">${formatTimeMMSS(item.totalSec)}</td>
                        <td class="py-2.5 px-3 text-center text-xs">${formatStarsText(item.difficulty)}</td>
                        <td class="py-2.5 px-3 text-right text-xs text-gray-400 max-w-[120px] truncate" title="${item.notes}">${item.notes || '---'}</td>
                    `;
                    p2Tbody.appendChild(tr);
                });
            }

            const statFast = document.getElementById('stat-fastest-overall');
            const statClose = document.getElementById('stat-closest-battle');
            const statTot = document.getElementById('stat-total-logged');
            if (statFast) statFast.innerText = fastestOverall.sec !== 999999 ? fastestOverall.label : '--';
            if (statClose) statClose.innerText = closestDiff !== 999999 ? closestLabel : '--';
            if (statTot) statTot.innerText = `${Object.keys(puzzleData).length} Puzzles`;
        }

        function formatTimeMMSS(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatHHMMSS(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            if (h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatTimeHHMMSS(totalSeconds) {
            return formatHHMMSS(totalSeconds);
        }

        function triggerSpookyCelebration() {
            const container = document.getElementById('particle-container');
            if (!container) return;
            const emojis = ['🦇', '🎃', '👻', '⚡', '🍬', '🔮', '⭐'];

            for (let i = 0; i < 14; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'absolute';
                el.style.left = `${Math.random() * 80 + 10}vw`;
                el.style.bottom = '10vh';
                el.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
                el.style.transition = 'all 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
                el.style.opacity = '1';
                el.style.zIndex = '100';
                container.appendChild(el);

                setTimeout(() => {
                    el.style.transform = `translateY(-${Math.random() * 400 + 200}px) translateX(${(Math.random() - 0.5) * 150}px) rotate(${Math.random() * 360}deg)`;
                    el.style.opacity = '0';
                }, 50);

                setTimeout(() => el.remove(), 1600);
            }
        }

        function openSettingsModal() {
            const container = document.getElementById('modal-container');
            const settingsModal = document.getElementById('modal-settings');
            const msgModal = document.getElementById('modal-message');

            settingsModal.classList.remove('hidden');
            msgModal.classList.add('hidden');
            container.classList.remove('hidden');

            document.getElementById('data-textarea').value = JSON.stringify({ settings, puzzleData }, null, 2);
        }

        function saveSettings() {
            const p1 = document.getElementById('input-p1-name').value.trim() || "Player 1";
            const p2 = document.getElementById('input-p2-name').value.trim() || "Player 2";
            settings.p1Name = p1;
            settings.p2Name = p2;
            persistAllData();
            updatePlayerNamesUI();
            renderScorecardGrid();
            updateStatsAndBanner();
            closeModal();
        }

        function copyExportData() {
            const textarea = document.getElementById('data-textarea');
            textarea.select();
            try {
                document.execCommand('copy');
                alertBoxCustom("Success", "Scorecard backup copied to clipboard!", "📋");
            } catch (e) {
                console.error("Copy failed", e);
            }
        }

        function importData() {
            const textarea = document.getElementById('data-textarea');
            try {
                const parsed = JSON.parse(textarea.value);
                if (parsed && parsed.puzzleData) {
                    puzzleData = parsed.puzzleData;
                    if (parsed.settings) {
                        settings = parsed.settings;
                    }
                    persistAllData();
                    updatePlayerNamesUI();
                    renderScorecardGrid();
                    updateStatsAndBanner();
                    closeModal();
                    alertBoxCustom("Success", "Haunt data restored successfully!", "🎃");
                } else if (typeof parsed === 'object') {
                    puzzleData = parsed;
                    persistAllData();
                    renderScorecardGrid();
                    updateStatsAndBanner();
                    closeModal();
                    alertBoxCustom("Success", "Puzzle data restored successfully!", "🎃");
                } else {
                    alertBoxCustom("Error", "Invalid JSON format.", "❌");
                }
            } catch (e) {
                alertBoxCustom("Error", "Failed to parse JSON backup string.", "❌");
            }
        }

        function confirmResetData() {
            const container = document.getElementById('modal-container');
            const settingsModal = document.getElementById('modal-settings');
            const msgModal = document.getElementById('modal-message');

            settingsModal.classList.add('hidden');
            msgModal.classList.remove('hidden');
            container.classList.remove('hidden');

            document.getElementById('msg-icon').innerText = '💀';
            document.getElementById('msg-title').innerText = 'Clear All History?';
            document.getElementById('msg-body').innerText = 'Are you sure you want to delete all saved 1:1 puzzle times? This cannot be undone.';
            
            const btnConfirm = document.getElementById('msg-btn-confirm');
            btnConfirm.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold transition";
            btnConfirm.onclick = function() {
                puzzleData = {};
                persistAllData();
                renderScorecardGrid();
                updateStatsAndBanner();
                closeModal();
            };
        }

        function alertBoxCustom(title, message, icon) {
            const container = document.getElementById('modal-container');
            const settingsModal = document.getElementById('modal-settings');
            const msgModal = document.getElementById('modal-message');

            settingsModal.classList.add('hidden');
            msgModal.classList.remove('hidden');
            container.classList.remove('hidden');

            document.getElementById('msg-icon').innerText = icon || '🎃';
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-body').innerText = message;
            
            const btnConfirm = document.getElementById('msg-btn-confirm');
            btnConfirm.className = "px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-semibold transition";
            btnConfirm.onclick = closeModal;
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
            document.getElementById('modal-settings').classList.add('hidden');
            document.getElementById('modal-message').classList.add('hidden');
        }
    </script>
